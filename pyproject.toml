[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orcid2bib"
version = "0.2.0"
description = "Fetch all public works from an ORCID profile and compile them into a BibTeX file."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "Clemens Drüe", email = "druee@uni-trier.de" },
]
keywords = ["orcid", "bibtex", "bibliography", "citations", "research"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "requests>=2.25",
    "bibtexparser>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]

[project.scripts]
orcid2bib = "orcid2bib.orcid2bib:main"
bibdiff = "orcid2bib.bibdiff:main"

[project.urls]
Homepage = "https://github.com/cdruee/orcid2bib"
Repository = "https://github.com/cdruee/orcid2bib"
Issues = "https://github.com/cdruee/orcid2bib/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/orcid2bib"]
