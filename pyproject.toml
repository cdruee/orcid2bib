[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "orcid2bib"
dynamic = ["version"]
description = "Fetch all public works from an ORCID profile and compile them into a BibTeX file. Also ships bibdiff, a tool for comparing BibTeX files."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "Clemens Drüe", email = "druee@uni-trier.de" },
]
keywords = ["orcid", "bibtex", "bibliography", "citations", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "requests>=2.25",
    "bibtexparser>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]

[project.scripts]
orcid2bib = "orcid2bib.orcid2bib:main"
bibdiff = "orcid2bib.bibdiff:main"

[project.urls]
Homepage = "https://github.com/cdruee/orcid2bib"
Repository = "https://github.com/cdruee/orcid2bib"
Issues = "https://github.com/cdruee/orcid2bib/issues"
Changelog = "https://github.com/cdruee/orcid2bib/releases"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# Derives the version from the latest git tag (e.g. "v1.2.3" -> "1.2.3").
# Writes the resolved version into this file at build time; it's generated,
# not committed (see .gitignore).
write_to = "src/orcid2bib/_version.py"
# Lets the package still build from a source tree with no git history/tags
# (e.g. a plain zip export) instead of hard-failing.
fallback_version = "0.0.0"
